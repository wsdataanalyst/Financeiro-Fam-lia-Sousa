// converte linhas do banco (snake_case) para o formato usado no app (camelCase)
function mapearDoBanco({ categorias, despesas, salarios, extras, tarefas }) {
  return {
    categorias: categorias?.length ? categorias : DEFAULT_CATEGORIES,
    despesas: (despesas || []).map((d) => ({
      id: d.id, valor: Number(d.valor), categoriaId: d.categoria_id, descricao: d.descricao || "", mes: d.mes,
    })),
    salarios: (salarios || []).map((s) => ({ id: s.id, pessoa: s.pessoa, valor: Number(s.valor), mes: s.mes })),
    extras: (extras || []).map((e) => ({ id: e.id, descricao: e.descricao, valor: Number(e.valor), mes: e.mes })),
    tarefas: (tarefas || []).map((t) => ({
      id: t.id, titulo: t.titulo, data: t.data || "", prazo: t.prazo || "",
      valor: Number(t.valor) || 0, concluida: !!t.concluida,
    })),
  };
}

async function buscarDados() {
  const [catRes, despRes, salRes, extRes, tarRes] = await Promise.all([
    supabase.from("categorias").select("*"),
    supabase.from("despesas").select("*"),
    supabase.from("salarios").select("*"),
    supabase.from("extras").select("*"),
    supabase.from("tarefas").select("*"),
  ]);
  const primeiroErro = [catRes, despRes, salRes, extRes, tarRes].find((r) => r.error);
  if (primeiroErro) throw primeiroErro.error;
  return mapearDoBanco({
    categorias: catRes.data, despesas: despRes.data, salarios: salRes.data, extras: extRes.data, tarefas: tarRes.data,
  });
}

// insere itens novos, atualiza os que mudaram e remove os que sumiram (comparando por id)
async function sincronizarTabela(tabela, antigos, novos, paraLinha) {
  const mapAntigos = new Map(antigos.map((x) => [x.id, x]));
  const mapNovos = new Map(novos.map((x) => [x.id, x]));
  const paraInserir = [];
  const paraAtualizar = [];

  for (const [id, item] of mapNovos) {
    if (!mapAntigos.has(id)) {
      paraInserir.push(paraLinha(item));
    } else {
      const linhaAntiga = JSON.stringify(paraLinha(mapAntigos.get(id)));
      const linhaNova = JSON.stringify(paraLinha(item));
      if (linhaAntiga !== linhaNova) paraAtualizar.push({ id, linha: paraLinha(item) });
    }
  }
  const idsParaRemover = antigos.filter((x) => !mapNovos.has(x.id)).map((x) => x.id);

  if (paraInserir.length) {
    const { error } = await supabase.from(tabela).insert(paraInserir);
    if (error) throw error;
  }
  for (const { id, linha } of paraAtualizar) {
    const { error } = await supabase.from(tabela).update(linha).eq("id", id);
    if (error) throw error;
  }
  if (idsParaRemover.length) {
    const { error } = await supabase.from(tabela).delete().in("id", idsParaRemover);
    if (error) throw error;
  }
}

function useDados() {
  const [dados, setDados] = useState({ categorias: DEFAULT_CATEGORIES, despesas: [], salarios: [], extras: [], tarefas: [] });
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);
  const dadosRef = useRef(dados);
  dadosRef.current = dados;

  const recarregar = useCallback(async () => {
    try {
      const novos = await buscarDados();
      setDados(novos);
      setErro(false);
    } catch (e) {
      setErro(true);
    } finally {
      setCarregando(false);
    }
  }, []);

  useEffect(() => {
    recarregar();

    // atualiza sozinho quando qualquer pessoa da família mexer no banco
    let temporizador = null;
    const recarregarComAtraso = () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(recarregar, 400);
    };
    const canal = supabase
      .channel("financeiro-familia-sousa-mudancas")
      .on("postgres_changes", { event: "*", schema: "public", table: "categorias" }, recarregarComAtraso)
      .on("postgres_changes", { event: "*", schema: "public", table: "despesas" }, recarregarComAtraso)
      .on("postgres_changes", { event: "*", schema: "public", table: "salarios" }, recarregarComAtraso)
      .on("postgres_changes", { event: "*", schema: "public", table: "extras" }, recarregarComAtraso)
      .on("postgres_changes", { event: "*", schema: "public", table: "tarefas" }, recarregarComAtraso)
      .subscribe();

    return () => {
      clearTimeout(temporizador);
      supabase.removeChannel(canal);
    };
  }, [recarregar]);

  const persistir = useCallback(async (novosDados) => {
    const antigos = dadosRef.current;
    setDados(novosDados); // atualização otimista, a tela responde na hora
    try {
      await Promise.all([
        sincronizarTabela("categorias", antigos.categorias, novosDados.categorias, (c) => ({ id: c.id, nome: c.nome, cor: c.cor })),
        sincronizarTabela("despesas", antigos.despesas, novosDados.despesas, (d) => ({ id: d.id, valor: d.valor, categoria_id: d.categoriaId, descricao: d.descricao, mes: d.mes })),
        sincronizarTabela("salarios", antigos.salarios, novosDados.salarios, (s) => ({ id: s.id, pessoa: s.pessoa, valor: s.valor, mes: s.mes })),
        sincronizarTabela("extras", antigos.extras, novosDados.extras, (e) => ({ id: e.id, descricao: e.descricao, valor: e.valor, mes: e.mes })),
        sincronizarTabela("tarefas", antigos.tarefas, novosDados.tarefas, (t) => ({ id: t.id, titulo: t.titulo, data: t.data || null, prazo: t.prazo || null, valor: t.valor || 0, concluida: !!t.concluida })),
      ]);
      setErro(false);
    } catch (e) {
      setErro(true);
      // algo falhou ao gravar — busca o estado real do banco de novo
      recarregar();
    }
  }, [recarregar]);

  return { dados, persistir, carregando, erro };
}

function useCalculos(dados, mes) {
  return useMemo(() => {
    const despesasMes = dados.despesas.filter((d) => d.mes === mes);
    const salariosMes = dados.salarios.filter((s) => s.mes === mes);
    const extrasMes = dados.extras.filter((e) => e.mes === mes);

    const totalDespesas = despesasMes.reduce((s, d) => s + Number(d.valor), 0);
    const totalSalarios = salariosMes.reduce((s, d) => s + Number(d.valor), 0);
    const totalExtras = extrasMes.reduce((s, d) => s + Number(d.valor), 0);
    const totalReceitas = totalSalarios + totalExtras;
    const saldo = totalReceitas - totalDespesas;

    const porCategoria = dados.categorias
      .map((cat) => {
        const total = despesasMes
          .filter((d) => d.categoriaId === cat.id)
          .reduce((s, d) => s + Number(d.valor), 0);
        return { ...cat, total };
      })
      .filter((c) => c.total > 0)
      .sort((a, b) => b.total - a.total);

    const maioresGastos = [...despesasMes].sort((a, b) => b.valor - a.valor).slice(0, 5);

    const mesPassado = mesAnterior(mes);
    const despesasMesPassado = dados.despesas.filter((d) => d.mes === mesPassado);
    const totalDespesasMesPassado = despesasMesPassado.reduce((s, d) => s + Number(d.valor), 0);
    const variacaoDespesas =
      totalDespesasMesPassado > 0
        ? ((totalDespesas - totalDespesasMesPassado) / totalDespesasMesPassado) * 100
        : null;

    // últimos 6 meses para o gráfico de evolução
    const meses6 = [];
    let cursor = mes;
    for (let i = 0; i < 6; i++) {
      meses6.unshift(cursor);
      cursor = mesAnterior(cursor);
    }
    const evolucao = meses6.map((m) => {
      const desp = dados.despesas.filter((d) => d.mes === m).reduce((s, d) => s + Number(d.valor), 0);
      const rec =
        dados.salarios.filter((s) => s.mes === m).reduce((s, d) => s + Number(d.valor), 0) +
        dados.extras.filter((e) => e.mes === m).reduce((s, d) => s + Number(d.valor), 0);
      return { mes: rotuloMes(m), Receitas: rec, Despesas: desp };
    });

    return {
      despesasMes, salariosMes, extrasMes, totalDespesas, totalSalarios, totalExtras,
      totalReceitas, saldo, porCategoria, maioresGastos, variacaoDespesas, evolucao,
    };
  }, [dados, mes]);
}

function gerarInsights(calc, mes) {
  const insights = [];
  const { totalReceitas, totalDespesas, saldo, porCategoria, variacaoDespesas } = calc;

  if (totalReceitas === 0 && totalDespesas === 0) {
    return [{
      tipo: "info",
      texto: "Ainda não há dados neste mês. Cadastre os salários e as primeiras contas para começar a ver os insights aqui.",
    }];
  }

  if (saldo < 0) {
    insights.push({
      tipo: "alerta",
      texto: `O mês está fechando no vermelho: as despesas superam as receitas em ${formatBRL(Math.abs(saldo))}. Plano de ação: revise os itens da categoria "${porCategoria[0]?.nome || "maior gasto"}" e corte pelo menos 10% dela até o fim do mês.`,
    });
  } else if (totalReceitas > 0 && saldo / totalReceitas < 0.1) {
    insights.push({
      tipo: "alerta",
      texto: `A sobra do mês está apertada (${formatBRL(saldo)}, menos de 10% da receita). Plano de ação: crie uma meta de poupança mínima antes de gastar com itens não essenciais.`,
    });
  } else {
    insights.push({
      tipo: "positivo",
      texto: `Boa! O mês fecha com saldo positivo de ${formatBRL(saldo)}. Plano de ação: considere direcionar parte desse valor para uma reserva de emergência da família.`,
    });
  }

  if (porCategoria.length > 0) {
    const top = porCategoria[0];
    const pct = totalReceitas > 0 ? (top.total / totalReceitas) * 100 : 0;
    if (pct > 35) {
      insights.push({
        tipo: "alerta",
        texto: `"${top.nome}" concentra ${pct.toFixed(0)}% da receita do mês (${formatBRL(top.total)}). Plano de ação: negocie contratos, compare fornecedores ou defina um teto mensal para essa categoria.`,
      });
    } else {
      insights.push({
        tipo: "info",
        texto: `A maior categoria de gasto é "${top.nome}", com ${formatBRL(top.total)} (${pct.toFixed(0)}% da receita).`,
      });
    }
  }

  if (variacaoDespesas !== null) {
    if (variacaoDespesas > 15) {
      insights.push({
        tipo: "alerta",
        texto: `As despesas subiram ${variacaoDespesas.toFixed(0)}% em relação ao mês passado. Plano de ação: identifique qual categoria puxou esse aumento e avalie se é um gasto pontual ou uma nova tendência.`,
      });
    } else if (variacaoDespesas < -10) {
      insights.push({
        tipo: "positivo",
        texto: `As despesas caíram ${Math.abs(variacaoDespesas).toFixed(0)}% frente ao mês anterior. Continue com os hábitos que geraram essa economia.`,
      });
    }
  }

  return insights;
}

const PALAVRAS_RECEITA_SALARIO = ["salário", "salario", "holerite", "contracheque", "pagamento do mês", "pagamento do mes"];
const PALAVRAS_RECEITA_EXTRA = [
  "bônus", "bonus", "freela", "freelance", "reembolso", "restituição", "restituicao",
  "prêmio", "premio", "13º", "decimo terceiro", "décimo terceiro", "venda de", "vendi",
  "presente em dinheiro", "rendimento", "cashback",
];
const PALAVRAS_RECEITA_GENERICA = ["recebi", "recebido", "recebimento", "depósito", "deposito", "pix recebido", "caiu na conta"];

const MAPA_PALAVRAS_CATEGORIA = {
  moradia: ["aluguel", "condomínio", "condominio", "iptu", "reforma"],
  alimentacao: ["mercado", "supermercado", "ifood", "restaurante", "padaria", "feira", "lanche", "almoço", "almoco", "jantar"],
  transporte: ["uber", "99", "combustível", "combustivel", "gasolina", "ônibus", "onibus", "estacionamento", "pedágio", "pedagio", "passagem"],
  saude: ["farmácia", "farmacia", "consulta", "médico", "medico", "plano de saúde", "plano de saude", "dentista", "exame", "remédio", "remedio"],
  educacao: ["escola", "faculdade", "curso", "mensalidade", "material escolar", "livro"],
  lazer: ["cinema", "netflix", "spotify", "viagem", "show", "streaming", "passeio", "bar", "balada"],
  contas: ["luz", "água", "agua", "internet", "telefone", "celular", "gás", "gas", "boleto", "fatura"],
};

function extrairValor(linha) {
  let m = linha.match(/r\$\s*([\d.]*\d(?:,\d{2})?)/i);
  if (!m) m = linha.match(/(\d{1,3}(?:\.\d{3})+,\d{2})/);
  if (!m) m = linha.match(/(\d+,\d{2})/);
  if (!m) m = linha.match(/\b(\d+)\b/);
  if (!m) return null;
  let raw = m[1].replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
  const val = parseFloat(raw);
  return isNaN(val) || val <= 0 ? null : val;
}

function extrairMes(linha, mesPadrao) {
  const m = linha.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
  if (!m) return mesPadrao;
  const mes = parseInt(m[2], 10);
  if (mes < 1 || mes > 12) return mesPadrao;
  const ano = m[3] ? (m[3].length === 2 ? 2000 + parseInt(m[3], 10) : parseInt(m[3], 10)) : parseInt(mesPadrao.split("-")[0], 10);
  return `${ano}-${String(mes).padStart(2, "0")}`;
}

function classificarLinha(linha, categorias) {
  const l = linha.toLowerCase();
  if (PALAVRAS_RECEITA_SALARIO.some((k) => l.includes(k))) return { destino: "salario" };
  if (PALAVRAS_RECEITA_EXTRA.some((k) => l.includes(k))) return { destino: "extra" };
  if (PALAVRAS_RECEITA_GENERICA.some((k) => l.includes(k))) return { destino: "extra" };

  for (const [id, palavras] of Object.entries(MAPA_PALAVRAS_CATEGORIA)) {
    if (palavras.some((p) => l.includes(p))) {
      const existente = categorias.find((c) => c.id === id);
      if (existente) return { destino: "despesa", categoriaId: existente.id };
    }
  }
  const outros = categorias.find((c) => c.id === "outros") || categorias[categorias.length - 1];
  return { destino: "despesa", categoriaId: outros?.id || categorias[0]?.id };
}

function analisarTexto(texto, categorias, mesPadrao) {
  return texto
    .split("\n")
    .map((l) => l.trim())
    .filter(Boolean)
    .map((linha) => {
      const valor = extrairValor(linha);
      if (valor === null) return null;
      const mes = extrairMes(linha, mesPadrao);
      const classificacao = classificarLinha(linha, categorias);
      return {
        id: uid(),
        incluir: true,
        original: linha,
        valor,
        mes,
        destino: classificacao.destino,
        categoriaId: classificacao.categoriaId || categorias[0]?.id || "",
        pessoa: "",
        descricao: linha,
      };
    })
    .filter(Boolean);
}

/* ---------------------------------------------------------------
   TAREFAS — datas e parser do robô
--------------------------------------------------------------- */
function hojeISO() {
  const h = new Date();
  return `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, "0")}-${String(h.getDate()).padStart(2, "0")}`;
}

function diasEntre(dataIsoA, dataIsoB) {
  const a = new Date(dataIsoA + "T00:00:00");
  const b = new Date(dataIsoB + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

function formatarDataBR(iso) {
  if (!iso) return "";
  const [ano, mes, dia] = iso.split("-");
  return `${dia}/${mes}/${ano}`;
}

function extrairDataTarefa(linha, hojeIso) {
  const l = linha.toLowerCase();
  const hoje = new Date(hojeIso + "T00:00:00");
  if (l.includes("amanhã") || l.includes("amanha")) {
    const d = new Date(hoje); d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  if (l.includes("hoje")) return hojeIso;

  const m = linha.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
  if (!m) return "";
  const dia = parseInt(m[1], 10);
  const mes = parseInt(m[2], 10);
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return "";
  const ano = m[3] ? (m[3].length === 2 ? 2000 + parseInt(m[3], 10) : parseInt(m[3], 10)) : hoje.getFullYear();
  return `${ano}-${String(mes).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
}

function analisarTarefas(texto, hojeIso) {
  return texto
    .split("\n")
    .map((l) => l.trim())
    .filter(Boolean)
    .map((linha) => ({
      id: uid(),
      incluir: true,
      original: linha,
      titulo: linha,
      valor: extrairValor(linha) || "",
      prazo: extrairDataTarefa(linha, hojeIso),
      data: "",
    }));
}

          doMes.map((ex, i) => (
            <div key={ex.id} className="flex items-center justify-between py-2.5" style={{ borderTop: i > 0 ? `1px solid ${C.line}` : "none" }}>
              <span className="text-sm" style={{ color: C.ink, fontFamily: "Inter, sans-serif" }}>{ex.descricao}</span>
              <div className="flex items-center gap-3">
                <Numero valor={ex.valor} tamanho="text-sm" cor={C.accent} />
                <button onClick={() => remover(ex.id)} style={{ color: C.inkFaint }} className="hover:opacity-70"><Trash2 size={15} /></button>
              </div>
            </div>
          ))
        )}
      </Cartao>
    </div>
  );
}

/* ---------------------------------------------------------------
   ABA: ROBÔ DE IMPORTAÇÃO
--------------------------------------------------------------- */
function Robo({ dados, persistir, mes }) {
  const [texto, setTexto] = useState("");
  const [itens, setItens] = useState(null);

  const analisar = () => {
    if (!texto.trim()) return;
    setItens(analisarTexto(texto, dados.categorias, mes));
  };

  const atualizarItem = (id, campo, valor) => {
    setItens((prev) => prev.map((it) => (it.id === id ? { ...it, [campo]: valor } : it)));
  };

  const removerItem = (id) => setItens((prev) => prev.filter((it) => it.id !== id));

  const selecionados = itens ? itens.filter((it) => it.incluir) : [];

  const confirmarImportacao = () => {
    if (!selecionados.length) return;
    const novasDespesas = [];
    const novosSalarios = [];
    const novosExtras = [];
    selecionados.forEach((it) => {
      if (it.destino === "despesa") {
        novasDespesas.push({ id: uid(), valor: Number(it.valor), categoriaId: it.categoriaId, descricao: it.descricao, mes: it.mes });
      } else if (it.destino === "salario") {
        novosSalarios.push({ id: uid(), pessoa: it.pessoa || "Não identificado", valor: Number(it.valor), mes: it.mes });
      } else if (it.destino === "extra") {
        novosExtras.push({ id: uid(), descricao: it.descricao, valor: Number(it.valor), mes: it.mes });
      }
    });
    persistir({
      ...dados,
      despesas: [...dados.despesas, ...novasDespesas],
      salarios: [...dados.salarios, ...novosSalarios],
      extras: [...dados.extras, ...novosExtras],
    });
    setTexto("");
    setItens(null);
  };

  const rotuloDestino = { despesa: "Despesa", salario: "Salário", extra: "Extra" };
  const corDestino = { despesa: C.danger, salario: C.primary, extra: C.accent };

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-xl font-semibold flex items-center gap-2" style={{ fontFamily: "Fraunces, serif", color: C.ink }}>
          <Bot size={22} style={{ color: C.accent }} /> Robô de lançamentos
        </h2>
        <p className="text-sm mt-1" style={{ color: C.inkMuted, fontFamily: "Inter, sans-serif" }}>
          Cole um texto com um lançamento por linha. Palavras como "salário" viram receita fixa, "freela", "bônus" ou "recebi" viram entrada extra, e o resto entra como despesa — a categoria é sugerida pelo conteúdo da linha.
        </p>
      </div>

      <Cartao style={{ padding: 18 }}>
        <Rotulo>Texto para analisar</Rotulo>
        <textarea
          value={texto}
          onChange={(e) => setTexto(e.target.value)}
          rows={6}
          placeholder={"Mercado Extra R$ 187,40\nPaguei conta de luz 210,00 dia 05/07\nRecebi salário 3200\nFreela site R$ 450,00"}
          className="w-full rounded-md px-3 py-2 text-sm outline-none"
          style={{ ...inputStyle, resize: "vertical" }}
        />
        <div className="mt-3 flex justify-end">
          <Botao onClick={analisar} variant="accent"><Sparkles size={16} />Analisar texto</Botao>
        </div>
      </Cartao>

      {itens && (
        <Cartao style={{ padding: 18 }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-semibold" style={{ color: C.ink, fontFamily: "Inter, sans-serif" }}>
              {itens.length === 0 ? "Nenhum valor identificado no texto" : `${itens.length} lançamento(s) identificado(s) — revise antes de confirmar`}
            </h3>
            {itens.length > 0 && (
              <Botao onClick={confirmarImportacao} disabled={!selecionados.length}>
                <CheckCircle2 size={16} />Adicionar {selecionados.length} selecionado(s)
              </Botao>
            )}
          </div>

          <div className="space-y-3">
            {itens.map((it) => (
              <div key={it.id} className="rounded-md p-3" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                <div className="flex items-start gap-2 mb-2">
                  <input type="checkbox" checked={it.incluir} onChange={(e) => atualizarItem(it.id, "incluir", e.target.checked)} className="mt-1" />
                  <div className="flex-1 min-w-0">
                    <p className="text-xs truncate" style={{ color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>"{it.original}"</p>
                  </div>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded-full flex-shrink-0" style={{ background: `${corDestino[it.destino]}22`, color: corDestino[it.destino] }}>
                    {rotuloDestino[it.destino]}
                  </span>
                  <button onClick={() => removerItem(it.id)} style={{ color: C.inkFaint }} className="hover:opacity-70 flex-shrink-0"><X size={15} /></button>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                  <div>
                    <Rotulo>Tipo</Rotulo>
                    <Selecao value={it.destino} onChange={(e) => atualizarItem(it.id, "destino", e.target.value)}>
                      <option value="despesa">Despesa</option>
                      <option value="salario">Salário</option>
                      <option value="extra">Extra</option>
                    </Selecao>
                  </div>
                  <div>
                    <Rotulo>Valor</Rotulo>
                    <Campo type="number" step="0.01" value={it.valor} onChange={(e) => atualizarItem(it.id, "valor", e.target.value)} />
                  </div>
                  <div>
                    <Rotulo>Mês</Rotulo>
                    <Campo type="month" value={it.mes} onChange={(e) => atualizarItem(it.id, "mes", e.target.value)} />
                  </div>
                  {it.destino === "despesa" && (
                    <div>
                      <Rotulo>Categoria</Rotulo>
                      <Selecao value={it.categoriaId} onChange={(e) => atualizarItem(it.id, "categoriaId", e.target.value)}>
                        {dados.categorias.map((c) => (<option key={c.id} value={c.id}>{c.nome}</option>))}
                      </Selecao>
                    </div>
                  )}
                  {it.destino === "salario" && (
                    <div>
                      <Rotulo>Quem recebeu</Rotulo>
                      <Campo type="text" placeholder="Nome" value={it.pessoa} onChange={(e) => atualizarItem(it.id, "pessoa", e.target.value)} />
                    </div>
                  )}
                  <div className={it.destino === "extra" ? "col-span-2 sm:col-span-2" : ""}>
                    <Rotulo>Descrição</Rotulo>
                    <Campo type="text" value={it.descricao} onChange={(e) => atualizarItem(it.id, "descricao", e.target.value)} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Cartao>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   ABA: TAREFAS E PROJETOS
--------------------------------------------------------------- */
function Tarefas({ dados, persistir }) {
  const hojeIso = hojeISO();
  const [form, setForm] = useState({ titulo: "", data: "", prazo: "", valor: "" });
  const [textoRobo, setTextoRobo] = useState("");
  const [itensRobo, setItensRobo] = useState(null);
  const [mostrarConcluidas, setMostrarConcluidas] = useState(false);

  const adicionar = (e) => {
    e.preventDefault();
    if (!form.titulo.trim()) return;
    const nova = {
      id: uid(), titulo: form.titulo.trim(), data: form.data, prazo: form.prazo,
      valor: form.valor ? Number(form.valor) : 0, concluida: false,
    };
    persistir({ ...dados, tarefas: [...dados.tarefas, nova] });
    setForm({ titulo: "", data: "", prazo: "", valor: "" });
  };

  const alternarConcluida = (id) => {
    persistir({
      ...dados,
      tarefas: dados.tarefas.map((t) => (t.id === id ? { ...t, concluida: !t.concluida } : t)),
    });
  };

  const remover = (id) => persistir({ ...dados, tarefas: dados.tarefas.filter((t) => t.id !== id) });

  const analisarRobo = () => {
    if (!textoRobo.trim()) return;
    setItensRobo(analisarTarefas(textoRobo, hojeIso));
  };

  const atualizarItemRobo = (id, campo, valor) => {
    setItensRobo((prev) => prev.map((it) => (it.id === id ? { ...it, [campo]: valor } : it)));
  };

  const removerItemRobo = (id) => setItensRobo((prev) => prev.filter((it) => it.id !== id));

  const confirmarImportacaoRobo = () => {
    const selecionados = itensRobo.filter((it) => it.incluir && it.titulo.trim());
    if (!selecionados.length) return;
    const novasTarefas = selecionados.map((it) => ({
      id: uid(), titulo: it.titulo.trim(), data: it.data, prazo: it.prazo,
      valor: it.valor ? Number(it.valor) : 0, concluida: false,
    }));
    persistir({ ...dados, tarefas: [...dados.tarefas, ...novasTarefas] });
    setTextoRobo("");
    setItensRobo(null);
  };

  const statusTarefa = (t) => {
    if (t.concluida) return { rotulo: "Concluída", cor: C.positive };
    if (!t.prazo) return { rotulo: "Sem prazo", cor: C.inkFaint };
    const diff = diasEntre(hojeIso, t.prazo);
    if (diff < 0) return { rotulo: "Atrasada", cor: C.danger };
    if (diff <= 5) return { rotulo: diff === 0 ? "Vence hoje" : `Vence em ${diff}d`, cor: C.accent };
    return { rotulo: "Em dia", cor: C.primary };
  };

  const tarefasVisiveis = [...dados.tarefas]
    .filter((t) => mostrarConcluidas || !t.concluida)
    .sort((a, b) => {
      if (a.concluida !== b.concluida) return a.concluida ? 1 : -1;
      if (!a.prazo) return 1;
      if (!b.prazo) return -1;
      return a.prazo.localeCompare(b.prazo);
    });

  const totalValor = dados.tarefas.filter((t) => !t.concluida).reduce((s, t) => s + Number(t.valor || 0), 0);

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-xl font-semibold flex items-center gap-2" style={{ fontFamily: "Fraunces, serif", color: C.ink }}>
          <ListChecks size={22} style={{ color: C.primary }} /> Tarefas e projetos da família
        </h2>
        <p className="text-sm mt-1" style={{ color: C.inkMuted, fontFamily: "Inter, sans-serif" }}>
          Custo estimado das tarefas em aberto: <Numero valor={totalValor} tamanho="text-sm" cor={C.danger} />
        </p>
      </div>

      {/* adicionar manualmente */}
      <Cartao style={{ padding: 18 }}>
        <Rotulo>Nova tarefa</Rotulo>
        <form onSubmit={adicionar} className="grid grid-cols-1 sm:grid-cols-5 gap-3 items-end">
          <div className="sm:col-span-2">
            <Campo type="text" placeholder="Ex.: Trocar telhado da garagem" value={form.titulo}
              onChange={(e) => setForm({ ...form, titulo: e.target.value })} />
          </div>
          <div>
            <Rotulo>Data</Rotulo>
            <Campo type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} />
          </div>
          <div>
            <Rotulo>Prazo</Rotulo>
            <Campo type="date" value={form.prazo} onChange={(e) => setForm({ ...form, prazo: e.target.value })} />
          </div>
          <div>
            <Rotulo>Valor (R$)</Rotulo>
            <Campo type="number" step="0.01" min="0" placeholder="0,00" value={form.valor}
              onChange={(e) => setForm({ ...form, valor: e.target.value })} />
          </div>
          <div className="sm:col-span-5 flex justify-end">
            <Botao type="submit"><PlusCircle size={16} />Adicionar tarefa</Botao>
          </div>
        </form>
      </Cartao>

      {/* robô de tarefas */}
      <Cartao style={{ padding: 18 }}>
        <h3 className="text-sm font-semibold mb-1 flex items-center gap-2" style={{ color: C.ink, fontFamily: "Inter, sans-serif" }}>
          <Bot size={18} style={{ color: C.accent }} /> Robô de tarefas
        </h3>
        <p className="text-sm mb-3" style={{ color: C.inkMuted, fontFamily: "Inter, sans-serif" }}>
          Cole uma tarefa por linha, com prazo e valor no meio do texto — ele identifica sozinho.
        </p>
        <textarea
          value={textoRobo}
          onChange={(e) => setTextoRobo(e.target.value)}
          rows={4}
          placeholder={"Trocar telhado até 15/09 R$ 1200\nPagar IPTU amanhã 450,00\nRevisão do carro 20/08"}
          className="w-full rounded-md px-3 py-2 text-sm outline-none"
          style={{ ...inputStyle, resize: "vertical" }}
        />
        <div className="mt-3 flex justify-end">
          <Botao onClick={analisarRobo} variant="accent"><Sparkles size={16} />Analisar texto</Botao>
        </div>

        {itensRobo && (
          <div className="mt-4 space-y-3">
            <div className="flex items-center justify-between">
              <h4 className="text-sm font-semibold" style={{ color: C.ink, fontFamily: "Inter, sans-serif" }}>
                {itensRobo.length === 0 ? "Nenhuma linha reconhecida" : `${itensRobo.length} tarefa(s) identificada(s) — revise antes de confirmar`}
              </h4>
              {itensRobo.length > 0 && (
                <Botao onClick={confirmarImportacaoRobo}><CheckCircle2 size={16} />Adicionar selecionadas</Botao>
              )}
            </div>
            {itensRobo.map((it) => (
              <div key={it.id} className="rounded-md p-3" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                <div className="flex items-start gap-2 mb-2">
                  <input type="checkbox" checked={it.incluir} onChange={(e) => atualizarItemRobo(it.id, "incluir", e.target.checked)} className="mt-1" />
                  <p className="flex-1 text-xs truncate" style={{ color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>"{it.original}"</p>
                  <button onClick={() => removerItemRobo(it.id)} style={{ color: C.inkFaint }} className="hover:opacity-70 flex-shrink-0"><X size={15} /></button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <div className="col-span-2 sm:col-span-1">
                    <Rotulo>Título</Rotulo>
                    <Campo type="text" value={it.titulo} onChange={(e) => atualizarItemRobo(it.id, "titulo", e.target.value)} />
                  </div>
                  <div>
                    <Rotulo>Prazo</Rotulo>
                    <Campo type="date" value={it.prazo} onChange={(e) => atualizarItemRobo(it.id, "prazo", e.target.value)} />
                  </div>
                  <div>
                    <Rotulo>Data</Rotulo>
                    <Campo type="date" value={it.data} onChange={(e) => atualizarItemRobo(it.id, "data", e.target.value)} />
                  </div>
                  <div>
                    <Rotulo>Valor</Rotulo>
                    <Campo type="number" step="0.01" value={it.valor} onChange={(e) => atualizarItemRobo(it.id, "valor", e.target.value)} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Cartao>

      {/* lista de tarefas */}
      <Cartao style={{ padding: 18 }}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-sm font-semibold" style={{ color: C.ink, fontFamily: "Inter, sans-serif" }}>
            Tarefas ({tarefasVisiveis.length})
          </h3>
          <label className="flex items-center gap-2 text-xs" style={{ color: C.inkMuted, fontFamily: "Inter, sans-serif" }}>
            <input type="checkbox" checked={mostrarConcluidas} onChange={(e) => setMostrarConcluidas(e.target.checked)} />
            Mostrar concluídas
          </label>
        </div>
        {tarefasVisiveis.length === 0 ? (
          <p className="text-sm py-8 text-center" style={{ color: C.inkFaint }}>Nenhuma tarefa por aqui</p>
        ) : (
          tarefasVisiveis.map((t, i) => {
            const status = statusTarefa(t);
            return (
              <div key={t.id} className="flex items-center justify-between py-2.5 gap-3" style={{ borderTop: i > 0 ? `1px solid ${C.line}` : "none" }}>
                <div className="flex items-center gap-3 min-w-0 flex-1">
                  <button onClick={() => alternarConcluida(t.id)} style={{ color: t.concluida ? C.positive : C.inkFaint }} className="flex-shrink-0 hover:opacity-70">
                    {t.concluida ? <CheckCircle2 size={18} /> : <Circle size={18} />}
                  </button>
                  <div className="min-w-0">
                    <p className="text-sm truncate" style={{ color: C.ink, fontFamily: "Inter, sans-serif", textDecoration: t.concluida ? "line-through" : "none" }}>
                      {t.titulo}
                    </p>
                    <div className="flex items-center gap-3 mt-0.5">
                      {t.prazo && (
                        <span className="text-xs flex items-center gap-1" style={{ color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>
                          <Clock size={11} /> {formatarDataBR(t.prazo)}
                        </span>
                      )}
                      <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: `${status.cor}22`, color: status.cor }}>
                        {status.rotulo}
                      </span>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-3 flex-shrink-0">
                  {t.valor > 0 && <Numero valor={t.valor} tamanho="text-sm" />}
                  <button onClick={() => remover(t.id)} style={{ color: C.inkFaint }} className="hover:opacity-70"><Trash2 size={15} /></button>
                </div>
              </div>
            );
          })
        )}
      </Cartao>
    </div>
  );
}

      <main className="max-w-6xl mx-auto px-5 pb-16">

          <>
            {aba === "dashboard" && <Dashboard dados={dados} mes={mes} setMes={setMes} />}
            {aba === "robo" && <Robo dados={dados} persistir={persistir} mes={mes} />}
            {aba === "despesas" && <Despesas dados={dados} persistir={persistir} mes={mes} setMes={setMes} />}
            {aba === "categorias" && <Categorias dados={dados} persistir={persistir} />}
            {aba === "salarios" && <Salarios dados={dados} persistir={persistir} mes={mes} setMes={setMes} />}
            {aba === "tarefas" && <Tarefas dados={dados} persistir={persistir} />}
            {aba === "extras" && <Extras dados={dados} persistir={persistir} mes={mes} setMes={setMes} />}
          </>
        )}

}

const raiz = ReactDOM.createRoot(document.getElementById("root"));
raiz.render(<App />);
